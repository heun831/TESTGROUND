name: Build debug APK

on:
  push:
    branches: [ main, "cursor/**" ]
  pull_request:

jobs:
  kotlin-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Kotlin debug APK
        working-directory: kotlin/NextGenExample
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NextGenExample-debug
          path: kotlin/NextGenExample/app/build/outputs/apk/debug/app-debug.apk
